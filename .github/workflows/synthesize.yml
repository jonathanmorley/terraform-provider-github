# Production synthesis: declarative base + patches -> main.
#
# Owned by the fork-owned overlay layer (this file lives on the fork-owned
# branch, so the synthesized output preserves it). Triggers: daily schedule
# for upstream drift, pushes to patch branches for immediacy, manual runs.
name: Synthesize

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [fork-owned, "patch/**", "feat/**"]
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: synthesize-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: jonathanmorley/fork-maintainer@aedc61c239606152cbeba7b1a96e020e740359cd
        id: synthesize
        with:
          config: synthesis.json
          lockfile: synthesis.lock
          sts-scope: jonathanmorley/terraform-provider-github
          sts-identity: provider-patch-stack
      - name: Report outcome
        run: echo "pushed=${{ steps.synthesize.outputs.pushed }} commit=${{ steps.synthesize.outputs.commit }}"
