# Production synthesis: declarative base + patches -> main.
#
# Owned by the fork-owned overlay layer (this file lives on the fork-owned
# branch, so the synthesized output preserves it). Triggers: daily schedule
# for upstream drift, pushes to patch branches for immediacy, manual runs.
name: Synthesize

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [fork-owned, "patch/**", "feat/**"]
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: synthesize-main
      cancel-in-progress: false
    # Model auth for agent-assisted conflict resolution. Create ANTHROPIC_API_KEY
    # (or your opencode default provider's key) as a repo secret; empty until
    # then, in which case conflicts fail closed as before.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: jonathanmorley/fork-maintainer@6234981a212200bb4cbcbd9802f85d04ac15da31
        id: synthesize
        with:
          config: synthesis.json
          lockfile: synthesis.lock
          sts-scope: jonathanmorley/terraform-provider-github
          sts-identity: provider-patch-stack
          resolve-with: opencode
          resolve-model: opencode/big-pickle
      - name: Report outcome
        run: echo "pushed=${{ steps.synthesize.outputs.pushed }} commit=${{ steps.synthesize.outputs.commit }}"
