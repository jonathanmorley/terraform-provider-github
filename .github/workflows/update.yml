# Production maintenance proposals: lock refresh + merged-patch removal as PRs.
#
# Owned by the control overlay layer. Weekly schedule plus manual runs
# (with optional dry-run preview). A human merges each proposal; the next
# synthesis reflects it.
name: Propose synthesis updates

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview without opening a PR"
        type: boolean
        default: false

jobs:
  update:
    uses: jonathanmorley/fork-maintainer/.github/workflows/update.yml@2c8302784e52f9d78ae04a19b66fee1862cf1139
    permissions:
      contents: write
      pull-requests: write
    with:
      config: synthesis.json
      lockfile: synthesis.lock
      dry-run: ${{ inputs.dry-run }}
