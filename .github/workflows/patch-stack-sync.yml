name: Patch stack sync

on:
  schedule:
    # Daily at 09:17 UTC
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without pushing or closing PRs"
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    permissions:
      contents: read
      id-token: write
    uses: jonathanmorley/patch-stack-action/.github/workflows/patch-stack-sync.yml@patch/octo-sts-in-workflow
    with:
      upstream_repo: integrations/terraform-provider-github
      fork_repo: jonathanmorley/terraform-provider-github
      dry_run: ${{ inputs.dry_run == true }}
      sts_scope: jonathanmorley/terraform-provider-github
      sts_identity: provider-patch-stack
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
