name: Patch stack sync

on:
  schedule:
    # Daily at 09:17 UTC
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without pushing or closing PRs"
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    uses: DJRHails/patch-stack-action/.github/workflows/patch-stack-sync.yml@main
    with:
      upstream_repo: integrations/terraform-provider-github
      fork_repo: jonathanmorley/terraform-provider-github
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      app_id: ${{ secrets.PATCH_STACK_APP_ID }}
      app_private_key: ${{ secrets.PATCH_STACK_APP_PRIVATE_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
